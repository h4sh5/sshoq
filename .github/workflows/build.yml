name: Go build and test
on:
  pull_request:
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build-linux:
    strategy:
        matrix:
          go-version: [ '1.25.x', '1.26.x' ]
          goos: [linux]
          ecdsatestuser: [ssh3-ecdsa-testuser]
          testuser: [ssh3-testuser]
          archparams: [{goarch: amd64, cc: gcc}] #,{goarch: arm64, cc: aarch64-linux-gnu-gcc}]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '${{matrix.go-version}}'
      - name: Install dependencies to generate ssh keys and certificates
        run: sudo apt -y update && sudo apt -y install openssh-client openssl
      - name: Set up integration test environment (users, keys, certificates)
        run: sudo -E PATH=$PATH SSH3_INTEGRATION_TESTS_KEY_DIR=/ ${{ github.workspace }}/setup_integration_tests.sh
      - name: Install
        run: make install
      - name: Classical unit tests
        run: make -e test
        env:
          GOOS: ${{matrix.goos}}
          GOARCH: ${{matrix.goarch}}
      - name: Integration tests
        run: sudo -E PATH=$PATH make -e integration-tests
        env:
          CERT_PEM: /cert.pem
          CERT_PRIV_KEY: /priv.key
          ATTACKER_PRIVKEY: /attacker_id_rsa
          TESTUSER_PRIVKEY: /testuser_id_rsa
          TESTUSER_ED25519_PRIVKEY: /testuser_id_ed25519
          TESTUSER_ECDSA_PRIVKEY: /testuser_id_ecdsa
          TESTUSER_USERNAME: ${{matrix.testuser}}
          ECDSATESTUSER_USERNAME: ${{matrix.ecdsatestuser}}
          CC: ${{matrix.archparams.cc}}
          CGO_ENABLED: "1"
          GOOS: ${{matrix.goos}}
          GOARCH: ${{matrix.archparams.goarch}}
          SSH3_INTEGRATION_TESTS_WITH_SERVER_ENABLED: "1"
  build-macos:
    strategy:
      matrix:
        go-version: [ '1.25.x', '1.26.x' ]
        goos: [darwin]
        goarch: [amd64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '${{matrix.go-version}}'
      - name: Install dependencies
        run: go get ./...
      - name: Build Binaries
        run:
          make
        env:
          GOOS: ${{matrix.goos}}
          GOARCH: ${{matrix.goarch}}
      - name: Classical unit tests
        run: make -e test
        env:
          GOOS: ${{matrix.goos}}
          GOARCH: ${{matrix.goarch}}
  build-other-unix:
    strategy:
      matrix:
        go-version: [ '1.25.x', '1.26.x']]
        goos: [freebsd]
        goarch: [amd64,arm64]
        exclude:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '${{matrix.go-version}}'
      - name: Install dependencies
        run: go get ./...
      - name: Build Binaries
        run:
          make -e
        env:
          GOOS: ${{matrix.goos}}
          GOARCH: ${{matrix.goarch}}
          GO_TAGS: disable_password_auth
